name: natsumi

services:
  natsumi:
    build: .
    image: natsumi:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # HTTPS/WSS with TLS terminated by the server (ADR 0006). Published on the host's IPv4 and IPv6 addresses;
    # IPv6 publishing needs IPv6 enabled in the Docker daemon.
    ports:
      - "${NATSUMI_PORT:-8443}:8443"
    # Secrets are never written in the config. They are mounted under /run/secrets and referenced by ...File settings.
    # The files keep their host permissions: make them readable by the container's node user (UID 1000) only.
    secrets:
      - natsumi_tls_cert
      - natsumi_tls_key
      - natsumi_github_client_secret
    volumes:
      - natsumi-data:/data
      - natsumi-pi:/var/lib/natsumi-pi
      # The runner socket of natsumi-tools. natsumi never gets the Docker socket (ADR 0011).
      - type: volume
        source: natsumi-tools-socket
        target: /run/natsumi-tools
        volume:
          nocopy: true
      - type: bind
        source: ${NATSUMI_CONFIG:-./config.example.json}
        target: /etc/natsumi/config.json
        read_only: true
    healthcheck:
      test: ["CMD", "node", "/app/dist/src/server/main.js", "health", "--data-dir", "/data"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Where the model's memory shell runs (ADR 0011, ADR 0018): only the commands in docker/tools-commands.txt, no
  # network, no secrets, and the memory repository alone. natsumi reaches its runner over a Unix socket.
  natsumi-tools:
    build:
      context: .
      target: tools
    image: natsumi-tools:local
    init: true
    restart: unless-stopped
    # Must be the UID natsumi runs as: memory files are readable by their owner only.
    user: "${NATSUMI_TOOLS_UID:-1000}:${NATSUMI_TOOLS_UID:-1000}"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    # The time limit of one command and the bytes of stdout and of stderr kept from it.
    command: ["serve", "-timeout", "10s", "-max-output", "65536"]
    volumes:
      # The working tree is writable: memory is written here (ADR 0018). Point both at loop.memoryRepository
      # if the repository is somewhere other than the data directory's memory/.
      - type: volume
        source: natsumi-data
        target: /memory
        volume:
          subpath: memory
          nocopy: true
      # The history, read-only on top of it: everything in the working tree can be rewritten or removed, and
      # nothing that was committed can be lost.
      - type: volume
        source: natsumi-data
        target: /memory/.git
        read_only: true
        volume:
          subpath: memory/.git
          nocopy: true
      - type: volume
        source: natsumi-tools-socket
        target: /run/natsumi-tools
        volume:
          nocopy: true
    # natsumi makes the memory repository, .git included, on its first start.
    depends_on:
      natsumi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/libexec/natsumi-tools-runner", "check"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  natsumi-data:
  natsumi-pi:
  # A small tmpfs owned by the tools user, holding only the runner socket.
  natsumi-tools-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=${NATSUMI_TOOLS_UID:-1000},gid=${NATSUMI_TOOLS_UID:-1000},mode=0755"

secrets:
  natsumi_tls_cert:
    file: ${NATSUMI_TLS_CERT:-./secrets/tls-cert.pem}
  natsumi_tls_key:
    file: ${NATSUMI_TLS_KEY:-./secrets/tls-key.pem}
  natsumi_github_client_secret:
    file: ${NATSUMI_GITHUB_CLIENT_SECRET_FILE:-./secrets/github-client-secret}
