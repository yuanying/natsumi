# Builds the iPhone app and uploads it to TestFlight (ADR 0031).
# Only main, by hand, and once a month: a TestFlight build expires after 90 days.
# Never on pull_request: this repository is public, and a fork must not reach the signing secrets.
name: iPhone TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - "!mac/Natsumi/**"
      - "!mac/NatsumiCoreTests/**"
      - "!mac/NatsumiPhoneUITests/**"
      - "!mac/**/*.md"
      - ".github/workflows/iphone-testflight.yml"
      - ".github/testflight/**"
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

# One upload at a time; a started upload is left to finish.
concurrency:
  group: iphone-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Xcode 27.0 by its version alias, so a later beta made the image's default does not build the upload.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MARKETING_VERSION: "1.0"
      BUILD_NUMBER: ${{ github.run_number }}
      TEAM_ID: R849P56TAV
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install the signing key and certificate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_DEVELOPMENT_P12 APPLE_DEVELOPMENT_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is not set"; exit 1; fi
          done
          umask 077
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing"
          echo "$ASC_KEY_P8" | base64 --decode > "$signing/AuthKey.p8"
          echo "$APPLE_DEVELOPMENT_P12" | base64 --decode > "$signing/development.p12"

          # A keychain of its own, so the runner's login keychain is not touched and the key is gone with the file.
          keychain="$signing/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing/development.p12" -k "$keychain" -f pkcs12 -P "$APPLE_DEVELOPMENT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d ' "')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$signing/development.p12"

          {
            echo "ASC_KEY_PATH=$signing/AuthKey.p8"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      # Signed for development with the certificate above. Without one in the keychain, xcodebuild would create a new
      # development certificate on every fresh runner until the account reaches its limit.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project mac/Natsumi.xcodeproj \
            -scheme NatsumiPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NatsumiPhone.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      # Re-signed for distribution with the cloud-managed certificate of the team, and uploaded to App Store Connect.
      - name: Export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NatsumiPhone.xcarchive" \
            -exportOptionsPlist .github/testflight/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $MARKETING_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key and certificate
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"
